spring.application.name=SmartContactManager
spring.datasource.url = jdbc:mysql://localhost:3306/SmartContactManager
spring.datasource.username = SmartContactManager
spring.datasource.password = <strong>password</strong>
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.jpa.show-sql=true
logging.level.org.springframework.transaction=DEBUG
logging.level.org.hibernate.engine.transaction.internal=DEBUG

file.upload-dir= uploads
server.tomcat.max-part-count=100 
#tomcat has stricter limits for enctype ="multipart/form-data" , it seperates the fields into multiple data parts 
#It is done in order to prevent Dos attacks 

