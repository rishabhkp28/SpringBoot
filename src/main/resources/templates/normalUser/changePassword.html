<th:block
      th:replace="~{dashboardBase :: base(~{::pageCss}, ~{::pageJs}, ~{::content})}">

<!-- ░░ PAGE CSS ░░ -->
<th:block th:fragment="pageCss">
    <link rel="stylesheet" th:href="@{/css/changePasswordStyle.css}"/>
</th:block>

<!-- ░░ PAGE CONTENT ░░ -->
<th:block th:fragment="content">
<div id="cp-page" class="cp-page">

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="cp-flash cp-flash-success">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="cp-flash cp-flash-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <!-- ── PAGE HEADING ──────────────────────────────────── -->
    <div class="cp-page-header">
        <a th:href="@{/user/viewProfileRequest}" class="cp-back-btn" title="Back to edit profile">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div>
            <h1 class="cp-page-title">Change Password</h1>
            <p class="cp-page-sub">Keep your account secure · all fields required to update</p>
        </div>
    </div>

    <!--
        th:object="${changePasswordDto}"
        Controller: model.addAttribute("changePasswordDto", new PasswordDto())
        DTO fields: currentPassword, newPassword, confirmNewPassword
    -->
    <form th:action="@{/user/changePasswordRequest}"
          method="post"
          th:object="${changePasswordDto}"
          class="cp-form"
          id="cp-form">

        <!--
            noOp hidden flag — JS sets this to "true" when all
            three fields are blank so the backend knows it's
            a deliberate no-op rather than an accidental empty submit.
        -->
        <input type="hidden" id="cp-noop-flag" name="noOp" value="false"/>

        <!-- Global server errors (BindingResult global rejects) -->
        <section id="cp-global-error">
            <div class="cp-flash cp-flash-error"
                 th:if="${#fields.hasGlobalErrors()}">
                <i class="fa-solid fa-circle-exclamation"></i>
                <div>
                    <p th:each="err : ${#fields.globalErrors()}"
                       th:text="${err}"></p>
                </div>
            </div>
        </section>

        <div class="cp-card-wrap">

            <!-- Icon header -->
            <div class="cp-icon-header">
                <div class="cp-icon-ring">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div class="cp-icon-glow"></div>
            </div>

            <!-- Main card -->
            <div class="cp-card" id="cp-main-card">

                <div class="cp-fields">

                    <!-- ── CURRENT PASSWORD ─────────────── -->
                    <!--
                        DTO: currentPassword — no constraint,
                        verified in service via BCrypt.
                    -->
                    <div class="cp-field-group" id="cp-fg-current">
                        <label class="cp-label" for="cp-current-password">
                            Current Password
                            <span class="cp-required-star">*</span>
                        </label>
                        <div class="cp-input-wrap cp-password-wrap">
                            <i class="fa-solid fa-key cp-input-icon"></i>
                            <input type="password"
                                   id="cp-current-password"
                                   th:field="*{currentPassword}"
                                   class="cp-input"
                                   placeholder="Enter your current password"
                                   th:classappend="${#fields.hasErrors('currentPassword')} ? ' is-invalid' : ''"
                                   autocomplete="current-password"/>
                            <button type="button" class="cp-toggle-pw"
                                    id="cp-toggle-current" title="Show/Hide">
                                <i class="fa-regular fa-eye" id="cp-eye-current"></i>
                            </button>
                        </div>
                        <!--
                            Controller adds model attr "currentPasswordError"
                            when BCrypt match fails (thrown as BadCredentialsException).
                            It also maps to BindingResult via result.reject("currentPassword",...).
                        -->
                        <section id="currentPasswordServerSide">
                            <p style="color:#f87171"
                               th:if="${#fields.hasErrors('currentPassword')}"
                               th:errors="*{currentPassword}"
                               class="cp-validation-msg"></p>
                        </section>
                        <p id="currentPasswordError" class="cp-validation-msg"></p>
                    </div>

                    <!-- Divider -->
                    <div class="cp-field-divider">
                        <span>New Credentials</span>
                    </div>

                    <!-- ── NEW PASSWORD ─────────────────── -->
                    <!--
                        DTO: newPassword
                        @NotBlank @Size(max=20)
                        @Pattern(^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$)
                        Note: DTO @Pattern doesn't enforce max=20 (see JS fix below).
                    -->
                    <div class="cp-field-group" id="cp-fg-new">
                        <label class="cp-label" for="cp-new-password">
                            New Password
                            <span class="cp-required-star">*</span>
                        </label>
                        <div class="cp-input-wrap cp-password-wrap">
                            <i class="fa-solid fa-lock cp-input-icon"></i>
                            <input type="password"
                                   id="cp-new-password"
                                   th:field="*{newPassword}"
                                   class="cp-input"
                                   placeholder="Choose a strong password"
                                   th:classappend="${#fields.hasErrors('newPassword')} ? ' is-invalid' : ''"
                                   maxlength="20"
                                   autocomplete="new-password"/>
                            <button type="button" class="cp-toggle-pw"
                                    id="cp-toggle-new" title="Show/Hide">
                                <i class="fa-regular fa-eye" id="cp-eye-new"></i>
                            </button>
                        </div>

                        <section id="newPasswordServerSide">
                            <p style="color:#f87171"
                               th:if="${#fields.hasErrors('newPassword')}"
                               th:errors="*{newPassword}"
                               class="cp-validation-msg"></p>
                        </section>
                        <p id="newPasswordError" class="cp-validation-msg"></p>

                        <!-- Requirement checklist — shown by JS when user starts typing -->
                        <div class="cp-req-wrap" id="cp-req-wrap" style="display:none;">
                            <p class="cp-req-title">Password must include</p>
                            <ul class="cp-req-list" id="cp-req-list">
                                <li class="cp-req-item" id="req-len-min">
                                    <i class="req-icon fa-solid fa-circle-xmark"></i>
                                    <span>At least 8 characters</span>
                                </li>
                                <li class="cp-req-item" id="req-len-max">
                                    <i class="req-icon fa-solid fa-circle-xmark"></i>
                                    <span>Max 20 characters</span>
                                </li>
                                <li class="cp-req-item" id="req-lower">
                                    <i class="req-icon fa-solid fa-circle-xmark"></i>
                                    <span>Lowercase letter</span>
                                </li>
                                <li class="cp-req-item" id="req-upper">
                                    <i class="req-icon fa-solid fa-circle-xmark"></i>
                                    <span>Uppercase letter</span>
                                </li>
                                <li class="cp-req-item" id="req-digit">
                                    <i class="req-icon fa-solid fa-circle-xmark"></i>
                                    <span>Number (0–9)</span>
                                </li>
                                <li class="cp-req-item" id="req-special">
                                    <i class="req-icon fa-solid fa-circle-xmark"></i>
                                    <span>Special char (@$!%*?&amp;)</span>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <!-- ── CONFIRM PASSWORD ─────────────── -->
                    <!--
                        DTO: confirmNewPassword — no constraint,
                        match checked in controller.
                    -->
                    <div class="cp-field-group" id="cp-fg-confirm">
                        <label class="cp-label" for="cp-confirm-password">
                            Confirm New Password
                            <span class="cp-required-star">*</span>
                        </label>
                        <div class="cp-input-wrap cp-password-wrap">
                            <i class="fa-solid fa-lock-open cp-input-icon"></i>
                            <input type="password"
                                   id="cp-confirm-password"
                                   th:field="*{confirmNewPassword}"
                                   class="cp-input"
                                   placeholder="Re-enter your new password"
                                   th:classappend="${#fields.hasErrors('confirmNewPassword')} ? ' is-invalid' : ''"
                                   maxlength="20"
                                   autocomplete="new-password"/>
                            <button type="button" class="cp-toggle-pw"
                                    id="cp-toggle-confirm" title="Show/Hide">
                                <i class="fa-regular fa-eye" id="cp-eye-confirm"></i>
                            </button>
                        </div>
                        <section id="confirmPasswordServerSide">
                            <p style="color:#f87171"
                               th:if="${#fields.hasErrors('confirmNewPassword')}"
                               th:errors="*{confirmNewPassword}"
                               class="cp-validation-msg"></p>
                        </section>
                        <p id="confirmPasswordError" class="cp-validation-msg"></p>
                    </div>

                </div><!-- /cp-fields -->

               
                <!-- Button row -->
                <div class="cp-btn-row">
                    <a th:href="@{/user/viewProfileRequest}" class="cp-btn cp-btn-cancel">
                        <i class="fa-solid fa-xmark"></i>
                        <span>Cancel</span>
                    </a>
                    <button type="submit" class="cp-btn cp-btn-save" id="cp-submit-btn">
                        <i class="fa-solid fa-floppy-disk"></i>
                        <span>Update Password</span>
                    </button>
                </div>

            </div><!-- /cp-card -->
        </div><!-- /cp-card-wrap -->

    </form>
</div>
</th:block>

<!-- ░░ PAGE JS ░░ -->
<th:block th:fragment="pageJs">
    <script th:src="@{/js/changePasswordScript.js}"></script>
</th:block>

</th:block>
