<th:block
      th:replace="~{dashboardBase :: base(~{::pageCss}, ~{::pageJs}, ~{::content})}">

<!-- ░░ PAGE CSS ░░ -->
<th:block th:fragment="pageCss">
    <link rel="stylesheet" th:href="@{/css/groupContactsStyle.css}"/>
</th:block>

<!-- ░░ PAGE CONTENT ░░ -->
<th:block th:fragment="content">
<div id="page-content">

    <div class="ct-layout">

        <!-- ── ALL CONTACTS ───────────────────────────────── -->
        <div class="dash-panel dash-anim dash-anim-d1">

            <div class="dash-panel-head">
                <div>
                    <h2 class="dash-panel-title" th:text="${nameOfGroup} + ' Contacts'"></h2>
                    <p class="dash-panel-sub"
                       th:text="${groupContacts != null ? groupContacts.size() + ' contacts' : '0 contacts'}">
                        0 contacts
                    </p>
                </div>
            </div>

            <!-- Contact table wrap -->
            <div class="dash-contact-table-wrap"
                 th:if="${groupContacts != null and !#lists.isEmpty(groupContacts)}">

                <!-- Table header -->
                <div class="dash-contact-thead">
                    <span class="dash-th dash-th-contact">Contact</span>
                    <span class="dash-th dash-th-fav">Fav</span>
                    <span class="dash-th dash-th-group">Group</span>
                </div>

                <!-- Rows -->
                <ul class="dash-contact-list">
                    <li class="dash-contact-row" th:each="c : ${groupContacts}">

                        <!-- Contact cell: avatar + name + email -->
                        <div class="dash-c-contact-cell">

                            <!-- Avatar: image if available, else initials -->
                            <div class="dash-c-av">
                                <img th:if="${c.fileName != null}"
                                     th:src="@{/user/images/{id}(id=${c.contactId})}"
                                     class="dash-c-av-img"
                                     alt="Contact photo"/>
                                <span th:if="${c.fileName == null}"
                                      th:text="${c.name != null ? #strings.substring(c.name,0,1).toUpperCase() : '?'}">?</span>
                            </div>

                            <div class="dash-c-info">
                                <p class="dash-c-name" th:text="${c.name}">Name</p>
                                <p class="dash-c-meta" th:text="${c.email != null ? c.email : ''}"></p>
                                <p class="dash-c-meta" th:text="${c.phone != null ? c.phone : ''}"></p>
                            </div>
                        </div>

                        <!-- Favourite cell -->
                        <div class="dash-c-fav-cell">
                            <span th:if="${c.favourite}" class="dash-fav-badge" title="Favourite">
                                <i class="fa-solid fa-star"></i>
                            </span>
                        </div>

                        <!-- Group cell -->
                        <div class="dash-c-group-cell">
                            <span th:if="${c.group != null and c.group.name() == 'WORK'}"      class="dash-tag dash-tag-work"      th:text="'Work'"></span>
                            <span th:if="${c.group != null and c.group.name() == 'FRIEND'}"    class="dash-tag dash-tag-friend"    th:text="'Friend'"></span>
                            <span th:if="${c.group != null and c.group.name() == 'FAMILY'}"    class="dash-tag dash-tag-family"    th:text="'Family'"></span>
                            <span th:if="${c.group != null and c.group.name() == 'CLIENT'}"    class="dash-tag dash-tag-client"    th:text="'Client'"></span>
                            <span th:if="${c.group != null and c.group.name() == 'ANONYMOUS'}" class="dash-tag dash-tag-anonymous" th:text="'Anonymous'"></span>
                        </div>

                    </li>
                </ul>
            </div>

            <p class="dash-panel-sub" style="text-align:center; padding:32px 0;"
               th:if="${groupContacts == null or #lists.isEmpty(groupContacts)}">
                No contacts yet.
            </p>

        </div><!-- /all contacts -->


        <!-- ── SIDE PANEL ─────────────────────────────────── -->
        <div class="ct-side dash-anim dash-anim-d2">
            <div class="dash-panel">
                <div class="dash-panel-head">
                    <div>
                        <h2 class="dash-panel-title">Quick Actions</h2>
                        <p class="dash-panel-sub">Jump right in</p>
                    </div>
                </div>
                <div class="dash-action-list">
                    <a th:href="@{/group/addContactRequest}" class="dash-action-btn">
                        <span class="dash-action-icon"><i class="fa-solid fa-user-plus"></i></span>
                        <span class="dash-action-label">Add New Contact</span>
                        <i class="fa-solid fa-chevron-right dash-action-arr"></i>
                    </a>
                </div>
            </div>
        </div><!-- /side -->

    </div><!-- /ct-layout -->

</div><!-- /page-content -->
</th:block>

<!-- ░░ PAGE JS ░░ -->
<th:block th:fragment="pageJs">
    <script th:src="@{/js/groupContactsScript.js}"></script>
</th:block>

</th:block>
