<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{dashboardBase :: base(~{::pageCss}, ~{::pageJs}, ~{::content})}">

<!-- ░░ PAGE CSS ░░ -->
<th:block th:fragment="pageCss">
    <link rel="stylesheet" th:href="@{/css/contactsAddedThisMonthStyle.css}"/>
</th:block>

<!-- ░░ PAGE CONTENT ░░ -->
<th:block th:fragment="content">
<div id="page-content">

    <div class="ct-layout">

        <!-- ── ALL CONTACTS ───────────────────────────────── -->
        <div class="dash-panel dash-anim dash-anim-d1">

            <div class="dash-panel-head">
                <div>
                    <h2 class="dash-panel-title">Contacts Added This Month</h2>
                    <p class="dash-panel-sub"
                       th:text="${contactsAddedThisMonth != null ? contactsAddedThisMonth.size() + ' contacts' : '0 contacts'}">
                        0 contacts
                    </p>
                </div>
            </div>

            <ul class="dash-contact-list"
                th:if="${contactsAddedThisMonth != null and !#lists.isEmpty(contactsAddedThisMonth)}">

                <li class="dash-contact-row" th:each="c : ${contactsAddedThisMonth}">

                    <div class="dash-c-av"
                         th:text="${c.name != null ? #strings.substring(c.name,0,2).toUpperCase() : '?'}">AB</div>

                    <div class="dash-c-info">
                        <p class="dash-c-name" th:text="${c.name}">Name</p>
                        <p class="dash-c-meta" th:text="${c.email != null ? c.email : ''}"></p>
                        <p class="dash-c-meta" th:text="${c.phone != null ? c.phone : ''}"></p>
                    </div>

                    <span th:if="${c.favourite}" class="dash-fav-badge" title="Favourite">
                        <i class="fa-solid fa-star"></i>
                    </span>

                    <span th:if="${c.group != null and c.group.name() == 'WORK'}"      class="dash-tag dash-tag-work"      th:text="'Work'"></span>
                    <span th:if="${c.group != null and c.group.name() == 'FRIEND'}"    class="dash-tag dash-tag-friend"    th:text="'Friend'"></span>
                    <span th:if="${c.group != null and c.group.name() == 'FAMILY'}"    class="dash-tag dash-tag-family"    th:text="'Family'"></span>
                    <span th:if="${c.group != null and c.group.name() == 'CLIENT'}"    class="dash-tag dash-tag-client"    th:text="'Client'"></span>
                    <span th:if="${c.group != null and c.group.name() == 'ANONYMOUS'}" class="dash-tag dash-tag-anonymous" th:text="'Anonymous'"></span>

                </li>

            </ul>

            <p class="dash-panel-sub" style="text-align:center; padding:32px 0;"
               th:if="${contactsAddedThisMonth == null or #lists.isEmpty(contactsAddedThisMonth)}">
                No contacts yet.
            </p>

        </div><!-- /all contacts -->


        <!-- ── SIDE PANEL ─────────────────────────────────── -->
        <div class="ct-side dash-anim dash-anim-d2">
            <div class="dash-panel">
                <div class="dash-panel-head">
                    <div>
                        <h2 class="dash-panel-title">Quick Actions</h2>
                        <p class="dash-panel-sub">Jump right in</p>
                    </div>
                </div>
                <div class="dash-action-list">
                    <a th:href="@{/user/addContactRequest}" class="dash-action-btn">
                        <span class="dash-action-icon"><i class="fa-solid fa-user-plus"></i></span>
                        <span class="dash-action-label">Add New Contact</span>
                        <i class="fa-solid fa-chevron-right dash-action-arr"></i>
                    </a>
                </div>
            </div>
        </div><!-- /side -->

    </div><!-- /ct-layout -->

</div><!-- /page-content -->
</th:block>

<!-- ░░ PAGE JS ░░ -->
<th:block th:fragment="pageJs">
    <script th:src="@{/js/contactsAddedThisMonthScript.js}"></script>
</th:block>

</html>
