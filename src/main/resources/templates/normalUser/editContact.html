<th:block
      th:replace="~{dashboardBase :: base(~{::pageCss}, ~{::pageJs}, ~{::content})}">

<!-- ░░ PAGE CSS ░░ -->
<th:block th:fragment="pageCss">
    <link rel="stylesheet" th:href="@{/css/editContactStyle.css}"/>
</th:block>

<!-- ░░ PAGE CONTENT ░░ -->
<th:block th:fragment="content">
<div id="edit-contact-page" class="ac-page">

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="ac-flash ac-flash-success">
        <i class="fa-solid fa-circle-check"></i>
        <span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="ac-flash ac-flash-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span th:text="${errorMessage}"></span>
    </div>

    <div class="ac-card">

        <!-- Card Header -->
        <div class="ac-card-header">
            <div class="ec-header-row">
                <!-- Back link -->
                <a th:href="@{/user/contacts}" class="ec-back-btn" title="Back to contacts">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div>
                    <h2 class="ac-card-heading">Edit Contact</h2>
                    <p class="ac-card-sub">Update the details below and save your changes</p>
                </div>
            </div>
        </div>

        <p class="ac-required-note">
            <span class="ac-required-star">*</span> Name, Phone and Group are required fields
        </p>

        <form th:action="@{/user/editThisContact}"
              method="post"
              enctype="multipart/form-data"
              th:object="${contactDto}"
              class="ac-form"
              id="ac-form">

            <!-- ✅ Hidden contactId so POST knows which contact to update -->
            <input type="hidden" th:field="*{contactId}"/>

            <!-- ✅ Hidden removePhoto flag — JS sets value to true when user removes photo -->
            <input type="hidden" id="removePhotoFlag" th:field="*{removePhoto}"/>

            <!-- Server-side global errors -->
            <section id="duplicateErrorServerSide">
                <p style="color:red"
                   th:if="${#fields.hasGlobalErrors()}"
                   th:each="err : ${#fields.globalErrors()}"
                   th:text="${err}"></p>
            </section>

            <!-- ── PROFILE PICTURE ──────────────────────── -->
            <div class="ac-field-group">
                <label class="ac-label">Profile Picture</label>

                <input type="file"
                       id="multipartFile"
                       th:field="*{multipartFile}"
                       accept="image/*"
                       class="ac-file-hidden"
                       th:classappend="${#fields.hasErrors('multipartFile')} ? ' is-invalid' : ''"/>

                <!-- Current photo preview — shown when contact already has one -->
                <div class="ec-current-photo" id="ec-current-photo"
                     th:if="${contactDto.fileName != null and contactDto.fileName != ''}">
                    <img th:src="@{/user/images/{id}(id=${contactDto.contactId})}"
                         class="ec-current-img" alt="Current photo"
                         id="ec-current-img"/>
                    <div class="ec-current-info">
                        <span class="ec-current-label">Current photo</span>
                        <span class="ec-current-hint">Upload a new image to replace · or</span>
                    </div>
                    <!-- ✅ Remove photo button -->
                    <button type="button" class="ec-remove-photo-btn" id="ec-remove-photo-btn" title="Remove photo">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>Remove</span>
                    </button>
                </div>

               
                <div class="ac-upload-zone" id="ac-upload-zone">
                    <div class="ac-upload-icon">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                    </div>
                    <span class="ac-upload-label" id="ac-upload-label">Click or drag image here</span>
                    <span class="ac-upload-sub"   id="ac-upload-sub">PNG · JPG · GIF · JPEG  —min 2KB, max 2 MB</span>

                    <div class="ac-preview-wrap" id="ac-preview-wrap">
                        <img src="" alt="Preview" class="ac-preview-img" id="ac-img-preview"/>
                        <div class="ac-preview-info">
                            <span class="ac-preview-name" id="ac-preview-name"></span>
                            <span class="ac-preview-size" id="ac-preview-size"></span>
                        </div>
                        <button type="button" class="ac-clear-btn" id="ac-clear-file" title="Remove">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>

                <section id="fileErrorServerSide">
                    <p style="color:red" th:if="${#fields.hasErrors('multipartFile')}"
                       th:errors="*{multipartFile}"
                       class="validation-msg"></p>
                </section>
                <p id="fileError" class="validation-msg"></p>
            </div>

            <!-- ── NAME + NICKNAME ──────────────────────── -->
            <div class="ac-form-grid">

                <div class="ac-field-group">
                    <label class="ac-label" for="name">
                        Full Name <span class="ac-required-star">*</span>
                    </label>
                    <div class="ac-input-wrap">
                        <i class="fa-solid fa-user ac-input-icon"></i>
                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               class="ac-input"
                               placeholder="John Doe"
                               th:classappend="${#fields.hasErrors('name')} ? ' is-invalid' : ''"
                               required/>
                    </div>
                    <section id="nameErrorServerSide">
                        <p style="color:red" th:if="${#fields.hasErrors('name')}"
                           th:errors="*{name}"
                           class="validation-msg"></p>
                    </section>
                    <p id="nameError" class="validation-msg"></p>
                </div>

                <div class="ac-field-group">
                    <label class="ac-label" for="nickName">Nickname</label>
                    <div class="ac-input-wrap">
                        <i class="fa-solid fa-tag ac-input-icon"></i>
                        <input type="text"
                               id="nickName"
                               th:field="*{nickName}"
                               class="ac-input"
                               placeholder="Johnny"
                               th:classappend="${#fields.hasErrors('nickName')} ? ' is-invalid' : ''"/>
                    </div>
                    <section id="nickNameErrorServerSide">
                        <p style="color:red" th:if="${#fields.hasErrors('nickName')}"
                           th:errors="*{nickName}"
                           class="validation-msg"></p>
                    </section>
                    <p id="nickNameError" class="validation-msg"></p>
                </div>

            </div>

            <!-- ── EMAIL ────────────────────────────────── -->
            <div class="ac-field-group">
                <label class="ac-label" for="email">Email</label>
                <div class="ac-input-wrap">
                    <i class="fa-solid fa-envelope ac-input-icon"></i>
                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           class="ac-input"
                           placeholder="john@gmail.com"
                           th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''"/>
                </div>
                <section id="emailErrorServerSide">
                    <p style="color:red" th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"
                       class="validation-msg"></p>
                </section>
                <p id="emailError" class="validation-msg"></p>
            </div>

            <!-- ── PHONE ─────────────────────────────────── -->
            <div class="ac-field-group">
                <label class="ac-label" for="phone">
                    Phone <span class="ac-required-star">*</span>
                </label>
                <div class="ac-input-wrap">
                    <i class="fa-solid fa-phone ac-input-icon"></i>
                    <input type="text"
                           id="phone"
                           th:field="*{phone}"
                           class="ac-input"
                           placeholder="9876543210"
                           th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid' : ''"
                           required/>
                </div>
                <section id="phoneErrorServerSide">
                    <p style="color:red" th:if="${#fields.hasErrors('phone')}"
                       th:errors="*{phone}"
                       class="validation-msg"></p>
                </section>
                <p id="phoneError" class="validation-msg"></p>
            </div>

            <!-- ── GROUP ─────────────────────────────────── -->
            <div class="ac-field-group">
                <label class="ac-label" for="group">
                    Group <span class="ac-required-star">*</span>
                </label>
                <div class="ac-select-wrap">
                    <i class="fa-solid fa-layer-group ac-input-icon"></i>
                    <select id="group"
                            th:field="*{group}"
                            class="ac-input ac-select"
                            required>
                        <option value="">Select group...</option>
                        <option th:each="g : ${T(com.springbootdeveloper.Models.ContactGroup).values()}"
                                th:value="${g}"
                                th:text="${g.name()}"
                                th:selected="${contactDto.group.name() == g.name()}">GROUP</option>
                    </select>
                    <span class="ac-select-arrow">
                        <i class="fa-solid fa-chevron-down"></i>
                    </span>
                </div>
                <section id="groupErrorServerSide">
                    <p style="color:red" th:if="${#fields.hasErrors('group')}"
                       th:errors="*{group}"
                       class="validation-msg"></p>
                </section>
                <p id="groupError" class="validation-msg"></p>
            </div>

            <!-- ── FAVOURITE ─────────────────────────────── -->
            <div class="ac-field-group">
                <div class="ac-favourite-wrap">
                    <input type="checkbox"
                           id="favourite"
                           th:field="*{favourite}"
                           class="ac-fav-checkbox"/>
                    <label for="favourite" class="ac-fav-label">
                        <span class="ac-fav-star" id="ac-fav-star">
                            <i class="fa-regular fa-star"></i>
                        </span>
                        <span class="ac-fav-text">Mark as Favourite</span>
                    </label>
                </div>
                <section id="favouriteErrorServerSide">
                    <p style="color:red" th:if="${#fields.hasErrors('favourite')}"
                       th:errors="*{favourite}"
                       class="validation-msg"></p>
                </section>
            </div>

            <!-- ── DESCRIPTION ───────────────────────────── -->
            <div class="ac-field-group">
                <label class="ac-label" for="description">
                    Description
                    <span class="ac-char-counter">
                        <span id="descriptionCharCount">0</span>/200
                    </span>
                </label>
                <div class="ac-input-wrap ac-input-wrap--textarea">
                    <i class="fa-solid fa-align-left ac-input-icon"></i>
                    <textarea id="description"
                              th:field="*{description}"
                              class="ac-input"
                              placeholder="Short note about this contact…"
                              maxlength="200"
                              th:classappend="${#fields.hasErrors('description')} ? ' is-invalid' : ''"></textarea>
                </div>
                <section id="descriptionErrorServerSide">
                    <p style="color:red" th:if="${#fields.hasErrors('description')}"
                       th:errors="*{description}"
                       class="validation-msg"></p>
                </section>
                <p id="descriptionError" class="validation-msg"></p>
            </div>

            <!-- ── SUBMIT ROW ────────────────────────────── -->
            <div class="ec-btn-row">
                <a th:href="@{/user/contacts}" class="ac-btn ec-btn-cancel">
                    <i class="fa-solid fa-xmark"></i>
                    <span>Cancel</span>
                </a>
                <button type="submit" class="ac-btn ac-btn-primary ec-btn-save" id="ac-submit-btn">
                    <i class="fa-solid fa-pen-to-square"></i>
                    <span>Save Changes</span>
                </button>
            </div>

        </form>
    </div>
</div>
</th:block>

<!-- ░░ PAGE JS ░░ -->
<th:block th:fragment="pageJs">
    <script th:src="@{/js/editContactScript.js}"></script>
</th:block>

</th:block>
